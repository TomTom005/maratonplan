
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Maratonplan">
<meta name="theme-color" content="#f1f5f9" id="theme-color-meta">
<title>Maratontreningsplan</title>

<style>
:root {
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --bg-primary: #ffffff;
  --bg-secondary: #f8fafc;
  --bg-page: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #475569;
  --text-tertiary: #94a3b8;
  --border-secondary: #e2e8f0;
  --border-tertiary: #f1f5f9;
  --done-bg: #EAF3DE;
  --radius-md: 10px;
  --radius-lg: 16px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg-primary: #1e2530;
    --bg-secondary: #252d3a;
    --bg-page: #151b26;
    --text-primary: #f1f5f9;
    --text-secondary: #94a3b8;
    --text-tertiary: #64748b;
    --border-secondary: #334155;
    --border-tertiary: #2a3344;
    --done-bg: #162416;
  }
  #theme-color-meta { content: "#151b26"; }
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-sans);
  background: var(--bg-page);
  color: var(--text-primary);
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}

.container {
  max-width: 1100px;
  margin: 0 auto;
  padding: 20px 24px;
}

/* ── HEADER ── */
.header { margin-bottom: 1.25rem; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.header-left h1 { font-size: 20px; font-weight: 600; color: var(--text-primary); margin-bottom: 2px; }
.header-left p { font-size: 13px; color: var(--text-secondary); }
.settings-link { font-size: 12px; color: var(--text-tertiary); cursor: pointer; padding: 4px; margin-top: 2px; }

/* ── PLAN START SETTINGS ── */
.plan-settings-row {
  display: none;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--text-secondary);
  background: var(--bg-secondary);
  border-radius: var(--radius-md);
  padding: 10px 12px;
  margin-bottom: 1rem;
  flex-wrap: wrap;
}
.plan-settings-row.open { display: flex; }
.plan-settings-row label { color: var(--text-secondary); }
.plan-settings-row input[type=date] {
  font-size: 12px;
  border: 0.5px solid var(--border-secondary);
  border-radius: 6px;
  padding: 4px 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  cursor: pointer;
}
.plan-settings-row button {
  font-size: 12px;
  padding: 4px 10px;
  border-radius: 6px;
  border: 0.5px solid #185FA5;
  background: none;
  color: #185FA5;
  cursor: pointer;
}

/* ── TODAY CARD ── */
.today-card {
  background: var(--bg-primary);
  border-radius: var(--radius-lg);
  padding: 14px 16px;
  margin-bottom: 1.25rem;
  border: 0.5px solid var(--border-secondary);
  box-shadow: 0 4px 16px rgba(0,0,0,0.06);
  display: flex;
  align-items: flex-start;
  gap: 12px;
}

.today-icon {
  width: 46px; height: 46px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
}

.today-content { flex: 1; min-width: 0; }
.today-label { font-size: 10px; font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 3px; }
.today-title { font-size: 16px; font-weight: 600; color: var(--text-primary); margin-bottom: 2px; }
.today-detail { font-size: 13px; color: var(--text-secondary); margin-bottom: 4px; }
.today-guide { font-size: 12px; color: var(--text-tertiary); line-height: 1.45; border-top: 0.5px solid var(--border-tertiary); padding-top: 6px; margin-top: 2px; }

.today-btn {
  flex-shrink: 0;
  padding: 8px 14px;
  border-radius: var(--radius-md);
  border: none;
  font-size: 13px; font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
  margin-top: 2px;
}
.today-btn.undone { background: #1D9E75; color: white; }
.today-btn.done { background: var(--done-bg); color: #1D9E75; border: 0.5px solid #1D9E75; }
.today-card.is-rest .today-btn { display: none; }

.today-outside { font-size: 13px; color: var(--text-secondary); padding: 12px 0 4px; }

/* ── STATS ── */
.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 1.25rem; }
.stat-card { background: var(--bg-secondary); border-radius: var(--radius-md); padding: 12px; text-align: center; }
.stat-num { font-size: 22px; font-weight: 500; color: var(--text-primary); }
.stat-label { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

/* ── PROGRESS ── */
.overall-progress { margin-bottom: 1.25rem; }
.op-label { font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; display: flex; justify-content: space-between; }
.op-bar { height: 8px; background: var(--border-tertiary); border-radius: 4px; overflow: hidden; }
.op-fill { height: 100%; background: linear-gradient(90deg, #1D9E75, #185FA5); border-radius: 4px; transition: width 0.4s; }

/* ── LEGEND ── */
.legend { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 1.25rem; }
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-secondary); }
.legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

/* ── PHASE NAV ── */
.phase-nav-wrapper { display: flex; align-items: center; gap: 8px; margin-bottom: 1rem; flex-wrap: wrap; }
.phase-nav { display: flex; gap: 6px; flex-wrap: wrap; }
.phase-btn { padding: 6px 14px; font-size: 13px; border-radius: var(--radius-md); border: 0.5px solid var(--border-secondary); background: var(--bg-primary); color: var(--text-secondary); cursor: pointer; transition: all 0.15s; }
.phase-btn:hover { background: var(--bg-secondary); }
.phase-btn.active { border-color: #185FA5; background: #E6F1FB; color: #185FA5; font-weight: 500; }

.jump-btn {
  font-size: 12px; color: #185FA5;
  background: none; border: 0.5px solid #185FA5;
  border-radius: 999px; padding: 5px 12px;
  cursor: pointer; white-space: nowrap;
  display: flex; align-items: center; gap: 4px;
}

/* ── PHASE HEADER ── */
.phase-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 1rem; padding: 14px 16px; border-radius: var(--radius-lg); border: 0.5px solid var(--border-tertiary); background: var(--bg-secondary); }
.phase-title { font-size: 16px; font-weight: 500; color: var(--text-primary); margin-bottom: 4px; }
.phase-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.5; max-width: 480px; }
.phase-badge { font-size: 12px; padding: 4px 10px; border-radius: 20px; white-space: nowrap; }

/* ── WEEK CARDS ── */
.week-grid { display: flex; flex-direction: column; gap: 8px; }
.week-card { background: var(--bg-primary); border: 0.5px solid var(--border-tertiary); border-radius: var(--radius-lg); overflow: hidden; }
.week-card.current-week { border-color: #185FA5; box-shadow: 0 0 0 2px rgba(24,95,165,0.12); }

.week-header { padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; background: var(--bg-secondary); border-bottom: 0.5px solid var(--border-tertiary); min-height: 44px; }
.week-label { font-size: 13px; font-weight: 500; color: var(--text-primary); }
.week-meta { font-size: 12px; color: var(--text-secondary); }
.week-progress { display: flex; align-items: center; gap: 8px; }
.week-pct { font-size: 12px; color: var(--text-secondary); min-width: 28px; text-align: right; }
.progress-bar { width: 60px; height: 4px; background: var(--border-tertiary); border-radius: 2px; overflow: hidden; }
.progress-fill-week { height: 100%; background: #1D9E75; border-radius: 2px; transition: width 0.3s; }
.week-toggle { font-size: 14px; color: var(--text-tertiary); transition: transform 0.2s; margin-left: 4px; }
.week-toggle.open { transform: rotate(180deg); }

/* Week complete flash */
@keyframes weekFlash {
  0%   { background: var(--bg-secondary); }
  30%  { background: #d1fae5; }
  100% { background: var(--bg-secondary); }
}
@media (prefers-color-scheme: dark) {
  @keyframes weekFlash {
    0%   { background: var(--bg-secondary); }
    30%  { background: #14532d; }
    100% { background: var(--bg-secondary); }
  }
}
.week-header.celebrating { animation: weekFlash 1.2s ease forwards; }

/* ── DAY CELLS (desktop 7-col grid) ── */
.days-grid { display: grid; grid-template-columns: repeat(7, 1fr); }

.day-cell {
  padding: 10px 6px 8px;
  border-right: 0.5px solid var(--border-tertiary);
  border-bottom: 0.5px solid var(--border-tertiary);
  min-height: 95px;
  cursor: pointer;
  transition: background 0.1s;
  position: relative;
}
.day-cell:last-child { border-right: none; }
.day-cell:hover { background: var(--bg-secondary); }
.day-cell.done { background: var(--done-bg); }
.day-cell.today-hl { box-shadow: inset 0 0 0 2px #185FA5; }

.day-name { font-size: 10px; font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; }
.day-type { font-size: 11px; font-weight: 500; margin-bottom: 3px; }
.day-detail { font-size: 10px; color: var(--text-secondary); line-height: 1.4; }
.day-guide { display: none; /* shown only in mobile */ }

.day-check {
  position: absolute; top: 6px; right: 6px;
  width: 16px; height: 16px; border-radius: 50%;
  border: 1.5px solid var(--border-secondary);
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; color: transparent; transition: all 0.15s;
}
.day-cell.done .day-check { background: #1D9E75; border-color: #1D9E75; color: white; }

/* Day type colors */
.day-cell.rest  .day-type { color: var(--text-tertiary); }
.day-cell.easy  .day-type { color: #185FA5; }
.day-cell.long  .day-type { color: #533489; }
.day-cell.tempo .day-type { color: #BA7517; }
.day-cell.interval .day-type { color: #D85A30; }
.day-cell.cross .day-type { color: #1D9E75; }
.day-cell.race  .day-type { color: #A32D2D; }

/* ── MOBILE RESPONSIVE ── */
@media (max-width: 640px) {
  .container { padding: 14px 12px; padding-bottom: max(env(safe-area-inset-bottom), 16px); }

  .header-left h1 { font-size: 17px; }

  .today-guide { display: block; }

  /* Stats 2×2 */
  .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 1rem; }
  .stat-num { font-size: 20px; }

  /* Phase nav horizontal scroll */
  .phase-nav {
    flex-wrap: nowrap;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding-bottom: 2px;
  }
  .phase-nav::-webkit-scrollbar { display: none; }
  .phase-btn { white-space: nowrap; flex-shrink: 0; font-size: 12px; padding: 6px 10px; }

  /* Phase header stack */
  .phase-header { flex-direction: column; gap: 8px; padding: 12px; }
  .phase-badge { align-self: flex-start; }
  .phase-desc { font-size: 12px; }

  /* Days: vertical list with grid layout per cell */
  .days-grid { display: flex; flex-direction: column; }

  .day-cell {
    display: grid;
    grid-template-columns: 32px 1fr 28px;
    grid-template-rows: auto auto auto;
    align-items: start;
    column-gap: 8px;
    min-height: auto;
    padding: 11px 14px;
    border-right: none;
    border-bottom: 0.5px solid var(--border-tertiary);
  }
  .day-cell:last-child { border-bottom: none; }
  .day-cell.today-hl { box-shadow: inset 3px 0 0 #185FA5; }

  .day-name  { grid-column: 1; grid-row: 1; align-self: center; font-size: 11px; margin-bottom: 0; }
  .day-type  { grid-column: 2; grid-row: 1; font-size: 13px; margin-bottom: 0; font-weight: 600; }
  .day-check { grid-column: 3; grid-row: 1; position: static; width: 24px; height: 24px; font-size: 11px; border-radius: 50%; }
  .day-detail { grid-column: 2; grid-row: 2; font-size: 12px; color: var(--text-secondary); margin-top: 2px; line-height: 1.4; }
  .day-guide  { grid-column: 2; grid-row: 3; display: block; font-size: 11px; color: var(--text-tertiary); margin-top: 4px; line-height: 1.4; padding-top: 4px; border-top: 0.5px solid var(--border-tertiary); }

  .legend { gap: 6px; margin-bottom: 1rem; }
  .legend-item { font-size: 11px; }
  .overall-progress { margin-bottom: 1rem; }
  .phase-nav-wrapper { flex-direction: column; align-items: flex-start; gap: 8px; }
}
</style>

<div class="container">

  <div class="header">
    <div class="header-left">
      <h1>Maratontreningsplan — 52 uker</h1>
      <p>Trykk en dag for å markere den som fullført</p>
    </div>
    <span class="settings-link" onclick="toggleSettings()" title="Innstillinger">⚙️</span>
  </div>

  <div class="plan-settings-row" id="settings-row">
    <label>Startdato for plan (mandag uke 1):</label>
    <input type="date" id="start-date-input">
    <button onclick="savePlanStart()">Lagre</button>
    <span id="settings-msg" style="color:#1D9E75;display:none">✓ Lagret</span>
  </div>

  <div id="today-card-wrap"></div>

  <div class="stats-grid">
    <div class="stat-card"><div class="stat-num" id="total-done">0</div><div class="stat-label">Dager fullført</div></div>
    <div class="stat-card"><div class="stat-num" id="total-pct">0%</div><div class="stat-label">Totalt fremgang</div></div>
    <div class="stat-card"><div class="stat-num" id="streak">0</div><div class="stat-label">Dagers streak</div></div>
    <div class="stat-card"><div class="stat-num">4:30–5:00</div><div class="stat-label">Målsetning</div></div>
  </div>

  <div class="overall-progress">
    <div class="op-label"><span>Totalt fremgang</span><span id="op-pct-text">0 / 364 dager</span></div>
    <div class="op-bar"><div class="op-fill" id="op-fill" style="width:0%"></div></div>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#185FA5"></div>Rolig løp</div>
    <div class="legend-item"><div class="legend-dot" style="background:#533489"></div>Langtur</div>
    <div class="legend-item"><div class="legend-dot" style="background:#BA7517"></div>Tempo</div>
    <div class="legend-item"><div class="legend-dot" style="background:#D85A30"></div>Intervall</div>
    <div class="legend-item"><div class="legend-dot" style="background:#1D9E75"></div>Styrke/kryss</div>
    <div class="legend-item"><div class="legend-dot" style="background:#A32D2D"></div>Løp/race</div>
    <div class="legend-item"><div class="legend-dot" style="background:#888780"></div>Hvile</div>
  </div>

  <div class="phase-nav-wrapper">
    <div class="phase-nav" id="phase-nav"></div>
    <button class="jump-btn" id="jump-btn" onclick="jumpToCurrentWeek()" style="display:none">📍 Gå til denne uken</button>
  </div>

  <div class="phase-header" id="phase-header"></div>
  <div class="week-grid" id="week-grid"></div>
</div>

<script>
const DAYS = ['Man','Tir','Ons','Tor','Fre','Lør','Søn'];

const phases = [
  { id:0, label:'Fase 1', name:'Grunnbyggende',       weeks:[1,12],  color:'#185FA5',
    desc:'Bygg løpebase fra scratch. 80% rolige løp (puls under 140). Fokus på konsistens, ikke fart. Maks 10% økning i ukentlig kilometer per uke (REI-prinsipp).' },
  { id:1, label:'Fase 2', name:'Aerob utvikling',     weeks:[13,24], color:'#533489',
    desc:'Øk ukentlig volum mot 50–60 km. Introduser lange turer opp mot 25 km. Begynn med lett tempoarbeid (80/20-prinsippet fra Dr. Stephen Seiler).' },
  { id:2, label:'Fase 3', name:'Maratonforberedelse', weeks:[25,40], color:'#BA7517',
    desc:'Spesifikk maratontrening. Lange turer opp mot 32 km. Tempoøkter i maratonfart. Intervaller en gang per uke. Hal Higdon Intermediate-prinsipp.' },
  { id:3, label:'Fase 4', name:'Peaking & taper',     weeks:[41,52], color:'#1D9E75',
    desc:'Topp uke 48, deretter nedtrapping (taper) de siste 3 ukene. Reduser volum 20–25% per uke. Behold intensitet, kutt distanse. Løpet uke 52.' },
];

// Coaching guide per type — shown as the third line on mobile
const TYPE_GUIDE = {
  easy:     '💬 Sone 2: du skal klare å holde en full samtale uten å anstrenge deg. Ikke sjekk pace – stol på pulsen (maks 140). Avslapp skuldrene, korte steg.',
  long:     '🕐 Start 15–20 sek/km roligere enn du tror. Ta med energi fra km 60 (gel eller dadler). Drikk hvert 20. min. Del turen i tre: lett → moderat → etter form.',
  tempo:    '🔥 Komfortabelt ubehagelig: korte fraser ok, hele setninger ikke. Varm opp 15 min rolig + 3 strides. Løp midtpartiet, kjøl ned 10 min. Puls 80–85% maks.',
  interval: '⚡ Full innsats på hvert drag – alle skal kjennes like tunge. Ta full pause (ikke snarvei). Varm opp 15 min + 4×100m strides. Puls 90–95% på toppen.',
  cross:    '🚴 Hold pulsen under 130 – dette er aktiv hvile, ikke trening. Sykkel, svøm eller yoga. Rull ut legger og hoftefleksorer etterpå (5–10 min).',
  rest:     '😴 Hvile er en del av treningen – det er nå du bygger deg sterkere. Spis næringsrikt, sov 8 timer, drikk 2–3 liter vann.',
  race:     '🏁 Start konservativt – løp de første 30 km etter plan, ikke etter følelse. Mål: negative split. Ta gel hvert 30–40 min fra start. Stol på treningen!',
};

const TYPE_ICON = {
  easy:'🟦', long:'🟣', tempo:'🟠', interval:'🔴', cross:'🟢', rest:'⬜', race:'🏁',
};
const TYPE_ICON_BG = {
  easy:'#e6f1fb', long:'#ede9f8', tempo:'#fef3c7', interval:'#fde8e1', cross:'#d1fae5', rest:'#f1f5f9', race:'#fde8e8',
};

// ─── Plan start date ───────────────────────────────────────────
const KEY        = 'marathon_plan_v3';
const START_KEY  = 'marathon_plan_start_v1';

let completed = JSON.parse(localStorage.getItem(KEY) || '{}');
function save() { try { localStorage.setItem(KEY, JSON.stringify(completed)); } catch(e){} }

function getMondayOf(date) {
  const d = new Date(date);
  d.setHours(0,0,0,0);
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  return d;
}

function getPlanStart() {
  const s = localStorage.getItem(START_KEY);
  if (s) return new Date(s);
  const m = getMondayOf(new Date());
  localStorage.setItem(START_KEY, m.toISOString());
  return m;
}

function getTodayPos() {
  const start = getPlanStart();
  const today = new Date(); today.setHours(0,0,0,0);
  const days = Math.floor((today - start) / 86400000);
  if (days < 0 || days >= 364) return null;
  return { week: Math.floor(days/7)+1, day: days%7 };
}

// ─── Settings ──────────────────────────────────────────────────
function toggleSettings() {
  const row = document.getElementById('settings-row');
  const isOpen = row.classList.contains('open');
  if (!isOpen) {
    const d = getPlanStart();
    document.getElementById('start-date-input').value = d.toISOString().slice(0,10);
  }
  row.classList.toggle('open');
}

function savePlanStart() {
  const val = document.getElementById('start-date-input').value;
  if (!val) return;
  const d = getMondayOf(new Date(val + 'T12:00:00'));
  localStorage.setItem(START_KEY, d.toISOString());
  const msg = document.getElementById('settings-msg');
  msg.style.display = 'inline';
  setTimeout(() => { msg.style.display = 'none'; }, 2000);
  renderTodayCard();
  updateStats();
  renderWeeks();
  updateJumpBtn();
}

// ─── Today card ────────────────────────────────────────────────
function renderTodayCard() {
  const wrap = document.getElementById('today-card-wrap');
  const pos = getTodayPos();

  if (!pos) {
    const start = getPlanStart();
    const today = new Date(); today.setHours(0,0,0,0);
    const days = Math.floor((today - start) / 86400000);
    const msg = days < 0
      ? `Planen starter ${start.toLocaleDateString('no-NO', {weekday:'long', day:'numeric', month:'long'})}`
      : 'Planen er fullført – gratulerer! 🎉';
    wrap.innerHTML = `<div class="today-card"><div class="today-content"><div class="today-outside">${msg}</div></div></div>`;
    return;
  }

  const { week, day } = pos;
  const phase = getPhaseForWeek(week);
  const weekInPhase = week - phase.weeks[0];
  const plan = getDayPlan(phase.id, weekInPhase, day);
  const isDone = !!completed[`${week}-${day}`];
  const todayLabel = DAYS[day] + ' · Uke ' + week;
  const icon = TYPE_ICON[plan.type] || '⬜';
  const iconBg = TYPE_ICON_BG[plan.type] || '#f1f5f9';
  const guide = TYPE_GUIDE[plan.type] || '';

  wrap.innerHTML = `
    <div class="today-card${plan.type==='rest'?' is-rest':''}" id="today-card-el">
      <div class="today-icon" style="background:${iconBg}">${icon}</div>
      <div class="today-content">
        <div class="today-label">${todayLabel}</div>
        <div class="today-title">${plan.label}</div>
        <div class="today-detail">${plan.detail}</div>
        <div class="today-guide">${guide}</div>
      </div>
      ${plan.type !== 'rest' ? `<button class="today-btn ${isDone?'done':'undone'}" onclick="toggleTodayDone(${week},${day},${phase.weeks[0]})">${isDone ? '✓ Ferdig' : 'Merk ferdig'}</button>` : ''}
    </div>
  `;
}

function toggleTodayDone(w, d, phaseStart) {
  const key = `${w}-${d}`;
  completed[key] = !completed[key];
  save();
  renderTodayCard();
  updateStats();
  renderDays(w, w - phaseStart);
  updateWeekProgress(w);
  checkWeekComplete(w);
}

// ─── Day plan data ─────────────────────────────────────────────
function getDayPlan(phase, weekInPhase, dayIdx) {
  const p = phase, w = weekInPhase, d = dayIdx;

  if (p === 0) {
    const kmBase = 3 + Math.min(w * 0.5, 6);
    const longKm = 6 + Math.min(w * 1, 14);
    const plans = [
      {type:'easy',  label:'Rolig løp',      detail:`${kmBase.toFixed(0)}–${(kmBase+1).toFixed(0)} km · Svært rolig puls`},
      {type:'rest',  label:'Hvile',           detail:'Aktiv restitusjon, tøyning, lett gange'},
      {type:'cross', label:'Styrke + gange',  detail:'Overkropps-styrke 20 min + 30 min rask gange'},
      {type:'easy',  label:'Rolig løp',       detail:`${kmBase.toFixed(0)} km · Snu hvis du føler deg tung`},
      {type:'rest',  label:'Hvile',           detail:'Full hvile eller lett yoga / tøyning'},
      {type:'long',  label:'Langtur',         detail:`${longKm.toFixed(0)} km · Svært rolig, gå om nødvendig`},
      {type:'cross', label:'Restitusjon',     detail:'Sykkel 30 min eller svøm · Lett og avslappet'},
    ];
    return plans[d];
  }

  if (p === 1) {
    const easy  = 7 + Math.min(w * 0.5, 7);
    const long  = 16 + Math.min(w * 1, 9);
    const tempo = 5 + Math.min(w * 0.5, 5);
    const plans = [
      {type:'easy',     label:'Rolig løp',        detail:`${easy.toFixed(0)} km · Puls under 140`},
      {type:'cross',    label:'Styrke',            detail:'Ben + kjernemuskulatur 30–40 min · Løpsdynamikk'},
      {type:'easy',     label:'Rolig løp + strides', detail:`${easy.toFixed(0)} km + 4×100m fartsstrides på slutten`},
      {type:'tempo',    label:'Tempoøkt',          detail:`${tempo.toFixed(0)} km komfortabelt ubehagelig · ca. 80–85% maks puls`},
      {type:'rest',     label:'Hvile',             detail:'Full hvile – viktig restitusjon etter tempoøkt'},
      {type:'long',     label:'Langtur',           detail:`${long.toFixed(0)} km · Rolig og stabilt · Gå pauser ved behov`},
      {type:'cross',    label:'Aktiv hvile',       detail:'Lett sykkel, yoga eller svøm 30–40 min'},
    ];
    return plans[d];
  }

  if (p === 2) {
    const easy     = 10 + Math.min(w * 0.3, 5);
    const long     = Math.min(22 + w, 32);
    const tempo    = 8 + Math.min(w * 0.3, 5);
    const interval = w < 8 ? '4×1000m i 10K-fart · 2 min pause' : '6×800m i 5K-fart · 90 sek pause';
    const plans = [
      {type:'easy',     label:'Rolig løp',         detail:`${easy.toFixed(0)} km · Recovery-puls (under 135)`},
      {type:'interval', label:'Intervalltrening',  detail: interval},
      {type:'easy',     label:'Rolig mellomøkt',   detail:`${(easy-2).toFixed(0)} km · Siste 3 km i maratonfart`},
      {type:'tempo',    label:'Tempoøkt',           detail:`${tempo.toFixed(0)} km i maratonfart + 10–15 sek/km`},
      {type:'rest',     label:'Hvile',              detail:'Full hvile – kritisk for superkompensasjon'},
      {type:'long',     label:'Langtur',            detail:`${long.toFixed(0)} km · Siste 10 km i maratonfart`},
      {type:'cross',    label:'Aktiv restitusjon',  detail:'Lett sykkel eller svøm 40 min · Rull musklene'},
    ];
    return plans[d];
  }

  if (p === 3) {
    const isRaceWeek = w >= 11;
    const isTaper   = w >= 8;
    const long      = isTaper ? Math.max(32 - (w-7)*4, 12) : 30 + Math.min(w*0.5, 2);

    if (isRaceWeek) {
      return [
        {type:'easy', label:'Lett jogg',         detail:'20 min · Rolig for å holde bena løse'},
        {type:'rest', label:'Hvile',              detail:'Spis pasta kvelden, hydrér godt hele dagen'},
        {type:'easy', label:'Kort aktivering',   detail:'10–15 min med 3×30 sek litt raskere'},
        {type:'rest', label:'Hvile total',        detail:'Lett gange, legg frem utstyr, tidlig legging'},
        {type:'rest', label:'Hvile',              detail:'Sov tidlig, spis kjent mat, stol på treningen'},
        {type:'race', label:'MARATON 🏁',         detail:'Løpsdagen! Løp de første 30 km konservativt'},
        {type:'rest', label:'Feiring & hvile',   detail:'Gratulerer! Restitusjon starter nå – spis, hvil, nyt'},
      ][d];
    }

    const plans = [
      {type:'easy',     label:'Rolig løp',   detail:`${isTaper ? Math.max(8, 14-w) : 12} km · Rolig og avslappet`},
      {type:'interval', label:'Intervall',   detail: isTaper ? '4×800m i 5K-fart · Behold skarphet' : '6×800m i 5K-fart · 90 sek pause'},
      {type:'easy',     label:'Rolig løp',   detail:`${isTaper ? 8 : 10} km · Lett og uthvilt`},
      {type:'tempo',    label:'Tempoøkt',    detail:`${isTaper ? 6 : 10} km i maratonfart · Kjenn rytmen`},
      {type:'rest',     label:'Hvile',       detail:'Full hvile – beina lades'},
      {type:'long',     label:'Langtur',     detail:`${long.toFixed(0)} km${isTaper ? ' · Siste lange tur – nyt den!' : ''}`},
      {type:'cross',    label:'Aktiv hvile', detail:'Sykkel 30 min · Foam rolling legger og hofter'},
    ];
    return plans[d];
  }

  return {type:'rest', label:'Hvile', detail:''};
}

// ─── Utilities ─────────────────────────────────────────────────
let activePhase = 0;

function getPhaseForWeek(w) {
  for (const p of phases) if (w >= p.weeks[0] && w <= p.weeks[1]) return p;
  return phases[0];
}

function getSpecialWeekNote(w) {
  if (w === 8)  return '🏅 Test-løp: 10 km';
  if (w === 20) return '🏅 Test-halvmaraton';
  if (w === 35) return '🏅 Test-halvmaraton igjen';
  if (w === 48) return '⛰️ Toppuke – høyeste volum';
  if (w === 52) return '🎯 MARATON!';
  return null;
}

function getWeekKm(globalWeek, phase, weekInPhase) {
  if (phase === 0) return Math.round(15 + weekInPhase * 2.5);
  if (phase === 1) return Math.round(35 + weekInPhase * 2);
  if (phase === 2) return Math.round(55 + Math.min(weekInPhase * 1.5, 10));
  if (phase === 3) {
    if (weekInPhase >= 11) return '~10 (race)';
    if (weekInPhase >= 8)  return Math.round(45 - (weekInPhase-7)*8);
    return Math.round(65 + Math.min(weekInPhase, 2));
  }
  return 30;
}

// ─── Render phase nav ──────────────────────────────────────────
function renderPhaseNav() {
  document.getElementById('phase-nav').innerHTML = phases.map(p =>
    `<button class="phase-btn${p.id===activePhase?' active':''}" onclick="setPhase(${p.id})">${p.label}: ${p.name} (${p.weeks[0]}–${p.weeks[1]})</button>`
  ).join('');
  updateJumpBtn();
}

function updateJumpBtn() {
  const pos = getTodayPos();
  const btn = document.getElementById('jump-btn');
  if (!pos) { btn.style.display = 'none'; return; }
  const phase = getPhaseForWeek(pos.week);
  if (phase.id === activePhase) {
    btn.style.display = 'flex';
  } else {
    btn.style.display = 'none';
  }
}

function renderPhaseHeader() {
  const p = phases[activePhase];
  document.getElementById('phase-header').innerHTML = `
    <div>
      <div class="phase-title">${p.label}: ${p.name}</div>
      <div class="phase-desc">${p.desc}</div>
    </div>
    <span class="phase-badge" style="background:${p.color}22;color:${p.color};border:0.5px solid ${p.color}44">Uke ${p.weeks[0]}–${p.weeks[1]}</span>
  `;
}

// ─── Render weeks ──────────────────────────────────────────────
function renderWeeks() {
  const p = phases[activePhase];
  const container = document.getElementById('week-grid');
  container.innerHTML = '';
  const todayPos = getTodayPos();

  for (let w = p.weeks[0]; w <= p.weeks[1]; w++) {
    const weekInPhase = w - p.weeks[0] + 1;
    let doneDays = 0;
    for (let d = 0; d < 7; d++) if (completed[`${w}-${d}`]) doneDays++;
    const pct = Math.round((doneDays / 7) * 100);
    const special = getSpecialWeekNote(w);
    const km = getWeekKm(w, activePhase, weekInPhase - 1);
    const isCurrentWeek = todayPos && todayPos.week === w;

    const card = document.createElement('div');
    card.className = 'week-card' + (isCurrentWeek ? ' current-week' : '');

    card.innerHTML = `
      <div class="week-header" onclick="toggleWeek(${w})" id="wheader-${w}">
        <div>
          <span class="week-label">Uke ${w}${special ? ' · ' + special : ''}${isCurrentWeek ? ' 📍' : ''}</span>
          <span class="week-meta" style="margin-left:10px">~${km} km</span>
        </div>
        <div class="week-progress">
          <div class="progress-bar"><div class="progress-fill-week" id="pfill-${w}" style="width:${pct}%"></div></div>
          <span class="week-pct" id="wpct-${w}">${pct}%</span>
          <span class="week-toggle" id="toggle-${w}">▾</span>
        </div>
      </div>
      <div id="days-${w}" style="display:none">
        <div class="days-grid" id="daygrid-${w}"></div>
      </div>
    `;
    container.appendChild(card);
    renderDays(w, weekInPhase - 1);
  }
}

function renderDays(w, weekInPhase) {
  const p = phases[activePhase];
  const grid = document.getElementById(`daygrid-${w}`);
  if (!grid) return;
  const todayPos = getTodayPos();
  grid.innerHTML = '';
  for (let d = 0; d < 7; d++) {
    const plan = getDayPlan(activePhase, weekInPhase, d);
    const isDone = !!completed[`${w}-${d}`];
    const isToday = todayPos && todayPos.week === w && todayPos.day === d;
    const guide = TYPE_GUIDE[plan.type] || '';
    const cell = document.createElement('div');
    cell.className = `day-cell ${plan.type}${isDone?' done':''}${isToday?' today-hl':''}`;
    cell.onclick = () => toggleDay(w, d, p.weeks[0]);
    cell.innerHTML = `
      <div class="day-check">✓</div>
      <div class="day-name">${DAYS[d]}</div>
      <div class="day-type">${plan.label}</div>
      <div class="day-detail">${plan.detail}</div>
      <div class="day-guide">${guide}</div>
    `;
    grid.appendChild(cell);
  }
}

// ─── Toggle / interact ─────────────────────────────────────────
function toggleWeek(w) {
  const days = document.getElementById(`days-${w}`);
  const tog  = document.getElementById(`toggle-${w}`);
  if (!days) return;
  const open = days.style.display !== 'none';
  days.style.display = open ? 'none' : 'block';
  if (tog) tog.classList.toggle('open', !open);
}

function toggleDay(w, d, phaseStart) {
  const key = `${w}-${d}`;
  completed[key] = !completed[key];
  save();
  renderTodayCard();
  updateStats();
  renderDays(w, w - phaseStart);
  updateWeekProgress(w);
  checkWeekComplete(w);
}

function checkWeekComplete(w) {
  let done = 0;
  for (let d = 0; d < 7; d++) if (completed[`${w}-${d}`]) done++;
  if (done === 7) {
    const hdr = document.getElementById(`wheader-${w}`);
    if (hdr) { hdr.classList.remove('celebrating'); void hdr.offsetWidth; hdr.classList.add('celebrating'); }
  }
}

function updateWeekProgress(w) {
  let done = 0;
  for (let d = 0; d < 7; d++) if (completed[`${w}-${d}`]) done++;
  const pct = Math.round((done/7)*100);
  const fill = document.getElementById(`pfill-${w}`);
  const pctEl = document.getElementById(`wpct-${w}`);
  if (fill)  fill.style.width  = pct + '%';
  if (pctEl) pctEl.textContent = pct + '%';
}

// ─── Streak (fixed: backwards from today) ─────────────────────
function calcStreak() {
  const start = getPlanStart();
  const today = new Date(); today.setHours(0,0,0,0);
  let streak = 0;

  for (let i = 0; i < 364; i++) {
    const checkDate = new Date(today.getTime() - i * 86400000);
    const daysSinceStart = Math.floor((checkDate - start) / 86400000);
    if (daysSinceStart < 0) break;

    const weekNum = Math.floor(daysSinceStart / 7) + 1;
    const dayNum  = daysSinceStart % 7;

    // Skip today if not yet done (don't break streak)
    if (i === 0 && !completed[`${weekNum}-${dayNum}`]) continue;

    if (completed[`${weekNum}-${dayNum}`]) {
      streak++;
    } else {
      break;
    }
  }
  return streak;
}

// ─── Stats ─────────────────────────────────────────────────────
function updateStats() {
  let total = 0;
  for (let w = 1; w <= 52; w++)
    for (let d = 0; d < 7; d++)
      if (completed[`${w}-${d}`]) total++;

  document.getElementById('total-done').textContent = total;
  const pct = Math.round((total / 364) * 100);
  document.getElementById('total-pct').textContent = pct + '%';
  document.getElementById('op-fill').style.width = pct + '%';
  document.getElementById('op-pct-text').textContent = `${total} / 364 dager`;
  document.getElementById('streak').textContent = calcStreak();
}

// ─── Phase nav + jump ──────────────────────────────────────────
function setPhase(id) {
  activePhase = id;
  renderPhaseNav();
  renderPhaseHeader();
  renderWeeks();
}

function jumpToCurrentWeek() {
  const pos = getTodayPos();
  if (!pos) return;
  const phase = getPhaseForWeek(pos.week);
  if (phase.id !== activePhase) setPhase(phase.id);

  // Open current week and scroll to it
  const days = document.getElementById(`days-${pos.week}`);
  const tog  = document.getElementById(`toggle-${pos.week}`);
  if (days && days.style.display === 'none') {
    days.style.display = 'block';
    if (tog) tog.classList.add('open');
  }
  setTimeout(() => {
    const card = document.querySelector(`.week-card.current-week`);
    if (card) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 50);
}

// ─── Init ──────────────────────────────────────────────────────
function init() {
  renderTodayCard();
  updateStats();

  // Auto-switch to the phase containing today
  const pos = getTodayPos();
  if (pos) {
    const phase = getPhaseForWeek(pos.week);
    activePhase = phase.id;
  }

  renderPhaseNav();
  renderPhaseHeader();
  renderWeeks();

  // Auto-open current week
  if (pos) {
    const days = document.getElementById(`days-${pos.week}`);
    const tog  = document.getElementById(`toggle-${pos.week}`);
    if (days) { days.style.display = 'block'; if (tog) tog.classList.add('open'); }
    setTimeout(() => {
      const card = document.querySelector('.week-card.current-week');
      if (card) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 200);
  }
}

init();
</script>
